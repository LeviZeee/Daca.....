name: Convert Colibita video for Chrome

on:
  push:
    paths:
      - '.github/workflows/transcode-colibita.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transcode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Convert to H.264 and AAC
        run: |
          ffmpeg -y -i assets/colibita/colibita-video.mp4 -c:v libx264 -preset medium -crf 22 -pix_fmt yuv420p -c:a aac -b:a 128k -movflags +faststart assets/colibita/colibita-video-converted.mp4
          mv assets/colibita/colibita-video-converted.mp4 assets/colibita/colibita-video.mp4
      - name: Save converted video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/colibita/colibita-video.mp4
          git diff --cached --quiet || git commit -m "Converteste videoclipul Colibita pentru Chrome"
          git push
